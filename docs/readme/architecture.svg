<text x="48" y="86" font-size="31" fill="#172B45" font-weight="700">A research workflow with clear boundaries</text>
<text x="48" y="116" font-size="17" fill="#52657A" font-weight="400">Presentation in the browser. Evidence, inference, and privileged access on the server.</text>
